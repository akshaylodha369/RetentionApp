<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main>

        <section class="business-profile">

            <div class="business-logo">
                🏪
            </div>

            <h1 id="businessName">Loading...</h1>

            <p id="businessCategory"></p>

            <p id="businessDistance"></p>

            <p id="businessOffer"></p>

            <button id="followButton" type="button">
                ❤️ Follow
            </button>

        </section>


        <section class="offer-card">

            <h2>🎁 Current Offer</h2>

            <p id="offerText">Loading offer...</p>

            <button id="rewardButton" type="button">
                Follow & Get Reward
            </button>

        </section>

    </main>


    <script>

        const params =
            new URLSearchParams(window.location.search);

        const businessId =
            params.get("id");


        const businessName =
            document.getElementById("businessName");

        const businessCategory =
            document.getElementById("businessCategory");

        const businessDistance =
            document.getElementById("businessDistance");

        const businessOffer =
            document.getElementById("businessOffer");

        const offerText =
            document.getElementById("offerText");

        const followButton =
            document.getElementById("followButton");

        const rewardButton =
            document.getElementById("rewardButton");


        let business = null;
        let following = false;
        let loggedIn = false;


        // =====================================================
        // LOAD CURRENT USER
        // =====================================================

        async function loadCurrentUser() {

            try {

                const response =
                    await fetch(
                        "/api/me",
                        {
                            credentials: "same-origin"
                        }
                    );

                if (!response.ok) {
                    loggedIn = false;
                    return;
                }

                const data =
                    await response.json();

                loggedIn =
                    data.logged_in === true;

            }

            catch (error) {

                console.error(
                    "USER CHECK ERROR:",
                    error
                );

                loggedIn = false;

            }

        }


        // =====================================================
        // LOAD BUSINESS
        // =====================================================

        async function loadBusiness() {

            try {

                if (!businessId) {

                    businessName.textContent =
                        "No business ID";

                    return;

                }


                const response =
                    await fetch(
                        `/api/businesses/${businessId}`,
                        {
                            credentials: "same-origin"
                        }
                    );


                if (response.status === 404) {

                    businessName.textContent =
                        "Business not found";

                    return;

                }


                if (!response.ok) {

                    throw new Error(
                        `Business request failed: ${response.status}`
                    );

                }


                business =
                    await response.json();


                // =================================================
                // DISPLAY BUSINESS
                // =================================================

                businessName.textContent =
                    business.name || "Business";


                businessCategory.textContent =
                    "🏷️ " +
                    (business.category || "Business");


                if (
                    business.distance_km !== undefined &&
                    business.distance_km !== null
                ) {

                    const distance =
                        Number(
                            business.distance_km
                        );

                    if (!Number.isNaN(distance)) {

                        businessDistance.textContent =
                            `📍 ${distance.toFixed(2)} km away`;

                    }

                } else {

                    businessDistance.textContent = "";

                }


                if (business.offer) {

                    businessOffer.textContent =
                        "🎟️ " +
                        business.offer;

                    offerText.textContent =
                        `Follow ${business.name} and get ${business.offer} on your next visit.`;

                } else {

                    businessOffer.textContent =
                        "🎟️ No offer available";

                    offerText.textContent =
                        "No current offer available.";

                }


                document.title =
                    business.name || "Business";


                await loadCurrentUser();


                if (loggedIn) {

                    await checkFollowStatus();

                } else {

                    following = false;

                    updateButtons();

                }

            }

            catch (error) {

                console.error(
                    "BUSINESS LOAD ERROR:",
                    error
                );

                businessName.textContent =
                    "Unable to load business";

            }

        }


        // =====================================================
        // CHECK FOLLOW STATUS
        // =====================================================

        async function checkFollowStatus() {

            try {

                const response =
                    await fetch(
                        `/api/businesses/${businessId}/follow`,
                        {
                            credentials: "same-origin"
                        }
                    );


                if (response.status === 401) {

                    following = false;

                    updateButtons();

                    return;

                }


                if (!response.ok) {

                    throw new Error(
                        `Follow status failed: ${response.status}`
                    );

                }


                const data =
                    await response.json();


                following =
                    data.following === true;


                updateButtons();

            }

            catch (error) {

                console.error(
                    "FOLLOW STATUS ERROR:",
                    error
                );

            }

        }


        // =====================================================
        // UPDATE BUTTONS
        // =====================================================

        function updateButtons() {

            if (following) {

                followButton.textContent =
                    "✅ Following";

                rewardButton.textContent =
                    "🎉 Reward Unlocked";

            } else {

                followButton.textContent =
                    "❤️ Follow";

                rewardButton.textContent =
                    "Follow & Get Reward";

            }

        }


        // =====================================================
        // FOLLOW / UNFOLLOW
        // =====================================================

        async function toggleFollow() {

            if (!loggedIn) {

                alert(
                    "Please login first to follow this business."
                );

                window.location.href =
                    "/static/login.html";

                return;

            }


            if (!businessId) {

                alert(
                    "Business not found."
                );

                return;

            }


            followButton.disabled = true;
            rewardButton.disabled = true;


            try {

                const response =
                    await fetch(
                        `/api/businesses/${businessId}/follow`,
                        {
                            method: "POST",
                            credentials: "same-origin"
                        }
                    );


                if (response.status === 401) {

                    loggedIn = false;
                    following = false;

                    updateButtons();

                    alert(
                        "Your login session has expired. Please login again."
                    );

                    window.location.href =
                        "/static/login.html";

                    return;

                }


                if (response.status === 404) {

                    alert(
                        "Business not found."
                    );

                    return;

                }


                if (!response.ok) {

                    let errorMessage =
                        "Could not update follow status.";

                    try {

                        const errorData =
                            await response.json();

                        if (errorData.detail) {

                            errorMessage =
                                errorData.detail;

                        }

                    }

                    catch (error) {

                        console.error(
                            "ERROR RESPONSE PARSE:",
                            error
                        );

                    }

                    throw new Error(
                        errorMessage
                    );

                }


                const data =
                    await response.json();


                following =
                    data.following === true;


                updateButtons();

            }

            catch (error) {

                console.error(
                    "FOLLOW ERROR:",
                    error
                );

                alert(
                    error.message ||
                    "Could not update follow status."
                );

            }

            finally {

                followButton.disabled = false;
                rewardButton.disabled = false;

            }

        }


        // =====================================================
        // FOLLOW BUTTON
        // =====================================================

        followButton.addEventListener(
            "click",
            toggleFollow
        );


        // =====================================================
        // REWARD BUTTON
        // =====================================================

        rewardButton.addEventListener(
            "click",
            toggleFollow
        );


        // =====================================================
        // START
        // =====================================================

        loadBusiness();

    </script>

</body>

</html>
