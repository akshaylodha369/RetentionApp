<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business</title>

    <link rel="stylesheet" href="/static/style.css?v=motion-polish-20261016">
    <link rel="stylesheet" href="/static/responsive.css?v=ui-smooth-20261016">
</head>

<body>

    <main>

        <section class="business-profile">

            <div class="business-logo">
                🏪
            </div>

            <h1 id="businessName">Loading...</h1>

            <p id="businessCategory"></p>

            <p id="businessDistance"></p>

            <p id="businessOffer"></p>

            <button id="followButton" type="button">
                ❤️ Follow
            </button>
            <button id="shareBusinessButton" type="button">Share business / show QR</button>
            <div id="businessQrPanel" hidden>
                <p>Scan this QR to open the business page.</p>
                <img id="businessQr" alt="QR code for this business" width="220" height="220">
                <p><a id="businessShareLink" href="#">Open share link</a></p>
                <p id="shareStatus" role="status" aria-live="polite"></p>
            </div>

        </section>


        <section class="offer-card">

            <h2>🎁 Current Offer</h2>

            <p id="offerText">Loading offer...</p>

            <button id="rewardButton" type="button">
                Follow & Get Reward
            </button>

        </section>

        <section class="offer-card">
            <h2>🎁 Loyalty rewards</h2>
            <p>See what you can redeem with points at this business.</p>
            <div id="businessRewards">Loading available rewards…</div>
            <p><a href="/static/loyalty.html">View your points and redemption history</a></p>
        </section>

    </main>


    <script>

        const params =
            new URLSearchParams(window.location.search);

        const businessId =
            params.get("id");


        const businessName =
            document.getElementById("businessName");

        const businessCategory =
            document.getElementById("businessCategory");

        const businessDistance =
            document.getElementById("businessDistance");

        const businessOffer =
            document.getElementById("businessOffer");

        const offerText =
            document.getElementById("offerText");

        const followButton =
            document.getElementById("followButton");

        const rewardButton =
            document.getElementById("rewardButton");
        const shareBusinessButton = document.getElementById("shareBusinessButton");
        const businessQrPanel = document.getElementById("businessQrPanel");
        const businessQr = document.getElementById("businessQr");
        const businessShareLink = document.getElementById("businessShareLink");
        const shareStatus = document.getElementById("shareStatus");

        let business = null;
        let following = false;
        let loggedIn = false;


        // =====================================================
        // LOAD CURRENT USER
        // =====================================================

        async function loadCurrentUser() {

            try {

                const response =
                    await fetch(
                        "/api/me",
                        {
                            credentials: "include",
                            cache: "no-store"
                        }
                    );

                if (!response.ok) {
                    loggedIn = false;
                    return;
                }

                const data =
                    await response.json();

                loggedIn =
                    data.logged_in === true;

            }

            catch (error) {

                console.error(
                    "USER CHECK ERROR:",
                    error
                );

                loggedIn = false;

            }

        }


        // =====================================================
        // LOAD BUSINESS
        // =====================================================

        async function loadBusiness() {

            try {

                if (!businessId) {

                    businessName.textContent =
                        "No business ID";

                    return;

                }


                const response =
                    await fetch(
                        `/api/businesses/${businessId}`,
                        {
                            credentials: "same-origin"
                        }
                    );


                if (response.status === 404) {

                    businessName.textContent =
                        "Business not found";

                    return;

                }


                if (!response.ok) {

                    throw new Error(
                        `Business request failed: ${response.status}`
                    );

                }


                business =
                    await response.json();


                // =================================================
                // DISPLAY BUSINESS
                // =================================================

                businessName.textContent =
                    business.name || "Business";


                businessCategory.textContent =
                    "🏷️ " +
                    (business.category || "Business");


                if (
                    business.distance_km !== undefined &&
                    business.distance_km !== null
                ) {

                    const distance =
                        Number(
                            business.distance_km
                        );

                    if (!Number.isNaN(distance)) {

                        businessDistance.textContent =
                            `📍 ${distance.toFixed(2)} km away`;

                    }

                } else {

                    businessDistance.textContent = "";

                }


                if (business.offer) {

                    businessOffer.textContent =
                        "🎟️ " +
                        business.offer;

                    offerText.textContent =
                        `Follow ${business.name} and get ${business.offer} on your next visit.`;

                } else {

                    businessOffer.textContent =
                        "🎟️ No offer available";

                    offerText.textContent =
                        "No current offer available.";

                }


                document.title =
                    business.name || "Business";


                await loadCurrentUser();


                if (loggedIn) {

                    await checkFollowStatus();

                } else {

                    following = false;

                    updateButtons();

                }

            }

            catch (error) {

                console.error(
                    "BUSINESS LOAD ERROR:",
                    error
                );

                businessName.textContent =
                    "Unable to load business";

            }

        }


        // =====================================================
        // CHECK FOLLOW STATUS
        // =====================================================

        async function checkFollowStatus() {

            try {

                const response =
                    await fetch(
                        `/api/businesses/${businessId}/follow`,
                        {
                            credentials: "same-origin"
                        }
                    );


                if (response.status === 401) {

                    following = false;

                    updateButtons();

                    return;

                }


                if (!response.ok) {

                    throw new Error(
                        `Follow status failed: ${response.status}`
                    );

                }


                const data =
                    await response.json();


                following =
                    data.following === true;


                updateButtons();

            }

            catch (error) {

                console.error(
                    "FOLLOW STATUS ERROR:",
                    error
                );

            }

        }


        // =====================================================
        // UPDATE BUTTONS
        // =====================================================

        function updateButtons() {

            if (following) {

                followButton.textContent =
                    "✅ Following";

                rewardButton.textContent =
                    "🎉 Reward Unlocked";

            } else {

                followButton.textContent =
                    "❤️ Follow";

                rewardButton.textContent =
                    "Follow & Get Reward";

            }

        }


        // =====================================================
        // FOLLOW / UNFOLLOW
        // =====================================================

        async function toggleFollow() {

            // Recheck the cookie-backed session at click time to avoid stale auth state.
            try {
                const sessionResponse = await fetch("/api/me", {
                    method: "GET",
                    credentials: "include",
                    cache: "no-store",
                    headers: { "Accept": "application/json" }
                });
                const sessionData = await sessionResponse.json();
                loggedIn = sessionResponse.ok && sessionData.logged_in === true;
            } catch (error) {
                loggedIn = false;
            }

            if (!loggedIn) {

                alert(
                    "Please login first to follow this business."
                );

                window.location.href =
                    "/static/login.html?next=" + encodeURIComponent(window.location.pathname + window.location.search);

                return;

            }


            if (!businessId) {

                alert(
                    "Business not found."
                );

                return;

            }


            followButton.disabled = true;
            rewardButton.disabled = true;


            try {

                const response =
                    await fetch(
                        `/api/businesses/${businessId}/follow`,
                        {
                            method: following ? "DELETE" : "POST",
                            credentials: "same-origin"
                        }
                    );


                if (response.status === 401) {

                    loggedIn = false;
                    following = false;

                    updateButtons();

                    alert(
                        "Your login session has expired. Please login again."
                    );

                    window.location.href =
                        "/static/login.html?next=" + encodeURIComponent(window.location.pathname + window.location.search);

                    return;

                }


                if (response.status === 404) {

                    alert(
                        "Business not found."
                    );

                    return;

                }


                if (!response.ok) {

                    let errorMessage =
                        "Could not update follow status.";

                    try {

                        const errorData =
                            await response.json();

                        if (errorData.detail) {

                            errorMessage =
                                errorData.detail;

                        }

                    }

                    catch (error) {

                        console.error(
                            "ERROR RESPONSE PARSE:",
                            error
                        );

                    }

                    throw new Error(
                        errorMessage
                    );

                }


                const data =
                    await response.json();


                following =
                    data.following === true;


                updateButtons();

            }

            catch (error) {

                console.error(
                    "FOLLOW ERROR:",
                    error
                );

                alert(
                    error.message ||
                    "Could not update follow status."
                );

            }

            finally {

                followButton.disabled = false;
                rewardButton.disabled = false;

            }

        }


        // =====================================================
        // FOLLOW BUTTON
        // =====================================================

        followButton.addEventListener(
            "click",
            toggleFollow
        );


        // =====================================================
        // REWARD BUTTON
        // =====================================================

        rewardButton.addEventListener(
            "click",
            function() {
                if (following) {
                    alert("You are already following this business. Show the offer above when you visit.");
                    return;
                }
                toggleFollow();
            }
        );


        shareBusinessButton.addEventListener("click", async function() {
            if (!businessId || !/^\d+$/.test(businessId)) {
                shareStatus.textContent = "Business link is unavailable.";
                return;
            }
            const shareUrl = window.location.origin + "/static/business.html?id=" + encodeURIComponent(businessId);
            businessQr.src = "/api/businesses/" + encodeURIComponent(businessId) + "/qr.svg";
            businessShareLink.href = shareUrl;
            businessQrPanel.hidden = false;
            try {
                if (navigator.share) {
                    await navigator.share({ title: businessName.textContent || "Local business", url: shareUrl });
                    shareStatus.textContent = "Share link opened.";
                } else if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(shareUrl);
                    shareStatus.textContent = "Business link copied. You can also scan the QR.";
                } else {
                    shareStatus.textContent = "Use the link shown below or scan the QR code.";
                }
            } catch (error) {
                if (error.name !== "AbortError") shareStatus.textContent = "QR is ready. Copy the link below to share.";
            }
        });

        async function loadBusinessRewards() {
            const root = document.getElementById("businessRewards");
            if (!businessId || !/^\d+$/.test(businessId)) {
                root.textContent = "Business not found.";
                return;
            }
            try {
                const response = await fetch("/api/businesses/" + encodeURIComponent(businessId) + "/rewards", { cache: "no-store" });
                if (!response.ok) throw new Error("Could not load rewards.");
                const rewards = await response.json();
                root.textContent = "";
                if (!rewards.length) {
                    root.textContent = "No loyalty rewards have been published yet.";
                    return;
                }
                rewards.forEach(function(reward) {
                    const card = document.createElement("article");
                    const title = document.createElement("h3");
                    const description = document.createElement("p");
                    const cost = document.createElement("p");
                    title.textContent = reward.title || "Reward";
                    description.textContent = reward.description || "";
                    cost.textContent = Number(reward.points_cost) + " points";
                    card.append(title, description, cost);
                    root.appendChild(card);
                });
            } catch (error) {
                root.textContent = "Rewards are temporarily unavailable. Please try again.";
            }
        }

        // =====================================================
        // START
        // =====================================================

        loadBusiness();
        loadBusinessRewards();

    </script>

<script src="/static/motion.js?v=smooth-20261016" defer defer></script>
</body>

</html>
